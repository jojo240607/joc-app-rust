[package]
name = "joc-app-rust"
version = "0.1.0"
edition = "2021"

[lib]
# 编成静态库供 C 固件链接（不是可执行 crate）
crate-type = ["staticlib"]
name = "app"

[profile.release]
opt-level = "z"      # 尺寸优先（F407 192KB SRAM/1MB Flash）
lto = true
codegen-units = 1
panic = "abort"      # 无 unwind；panic! -> UDF -> 内核 fault handler
debug = false

[dependencies]
cortex-m = "0.7"             # 仅用于 fpu/simd 指令 / DSB 等（App 不直接操作裸寄存器）
embedded-hal = "0.2"         # 提供 I2C/SPI 等 trait 占位（App 不直接碰裸寄存器）
heapless = "0.8"             # 无堆环形缓冲（命令/帧缓冲）

# 飞控核心算法（estimator/controller/vehicle/fdir/comm），no_std + 仅依赖 libm。
# 不启用 stm32f407：App 经 RTOS 设备 vtable 做 IO，绝不碰裸寄存器（规避 CCM/MPU/DMA 风险）。
flyctrl-core = { path = "../flyctrl/core" }

# 数学函数（sinf/cosf），供占位 IMU 注入等使用（flyctrl-core 自身也依赖它）。
libm = "0.2"

# 调试 feature：启用极简 demo 入口（只起一个打日志任务，不碰任何外设），
# 用于先验证 App 拉起链路（RTOS 异步 app_host 任务）是否跑通，再切回正式 flyctrl。
# 默认关闭。构建：`cargo build --release --features demo`（经 CMake RUST_APP_LIB 注入）。
[features]
default = []
demo = []
# 启用 USB CDC 下行验证 demo（隔离验证 usb0 写通道是否通畅），
# 不碰 EST_MTX/传感器，只周期经 usb0 写一行 + 经 uart0 镜像日志。
# 构建：`cargo build --release --features usbtest`（经 CMake RUST_APP_LIB 注入）。
usbtest = []
# 启用真实传感器驱动（I2C IMU/Baro/Mag + UART GPS/SBUS）替代虚拟回放源。
# 默认关闭：使用 VirtualXxx 虚拟源，无需外接硬件即可闭环调试。
# 构建：`cargo build --release --features real-sensors`（经 CMake RUST_APP_LIB 注入）。
real-sensors = []
